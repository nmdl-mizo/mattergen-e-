hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

defaults:
  - data_module: mp_20_curated
  - trainer: default
  - lightning_module: default
  - adapter: default

trainer:
  max_epochs: 750
  logger:
    job_type: train_finetune

lightning_module:
  optimizer_partial:
    lr: 1e-4
