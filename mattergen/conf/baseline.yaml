hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: True

defaults:
  - data_module: mp_20_curated
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: baseline
  - lightning_module/diffusion_module/model: baseline
  - lightning_module/diffusion_module/corruption: baseline
