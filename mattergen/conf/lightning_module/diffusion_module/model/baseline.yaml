_target_: mattergen.denoiser.GemNetTDenoiser
hidden_dim: 512
gemnet:
  _target_: mattergen.common.gemnet.gemnet.GemNetT
  num_targets: 1
  node_dim: 512
  latent_dim: ${eval:'${..hidden_dim} * (1 + len(${..property_embeddings}) + len(${..site_property_embeddings}))'}  # 1 is for time encoding.
  atom_embedding:
    _target_: mattergen.common.gemnet.layers.embedding_block.AtomEmbedding
    emb_size: ${..node_dim}
    with_mask_type: ${eval:'${...denoise_atom_types} and "${...atom_type_diffusion}" == "mask"'}
  site_embeddings: {}
  atom_additional_property_dim: 1
  emb_size_edge: 512
  emb_size_trip: 64
  max_neighbors: 50
  max_cell_images_per_dim: 5
  cutoff: 7.
  num_blocks: 4
  regress_stress: true
  otf_graph: true
  scale_file: ${oc.env:PROJECT_ROOT}/common/gemnet/gemnet-dT.json
atom_predictor:
  _target_: mattergen.diffusion.model_utils.MlpDecoding
  d_model: ${..gemnet.node_dim}
  output_dim: 101
  hidden_dims: [1024, 1024]
site_structure_eps_predictors: {}
denoise_atom_types: true
atom_type_diffusion: mask
property_embeddings_adapt: {}
property_embeddings: {}
site_property_embeddings: {}
site_property_embeddings_adapt: {}
defaults: []
